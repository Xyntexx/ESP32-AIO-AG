; Default single-GPS build. Override GPS_HEADING in a derived env to enable
; the dual-antenna heading code path (see [env:esp32-s3_dual_gps] below).
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
upload_protocol = esp-builtin
platform_packages =
	platformio/tool-openocd-esp32@~2.1200.0
lib_deps =
	adafruit/Adafruit BNO08x@^1.2.3
	sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.20
	https://github.com/Xyntexx/WebServer_ESP32_SC_W6100
build_flags =
	-DARDUINO_USB_MODE=1
	-DGPS_HEADING=0
debug_tool = esp-builtin
monitor_filters = esp32_exception_decoder

; Dual-GPS build for PCB revisions with a second u-blox module on the
; heading antenna pins. Same upload protocol as the default env.
[env:esp32-s3_dual_gps]
extends = env:esp32-s3
build_flags =
	-DARDUINO_USB_MODE=1
	-DGPS_HEADING=1

; Keya CAN motor build. Replaces the PWM motor backend with a Keya CAN driver
; on the CAN_TX_PIN/CAN_RX_PIN pair. Default GPS layout (single-GPS PCB).
[env:esp32-s3_keya]
extends = env:esp32-s3
build_flags =
	-DARDUINO_USB_MODE=1
	-DGPS_HEADING=0
	-DKEYA_MOTOR=1

; Keya CAN bench-test build. Same as esp32-s3_keya but the TWAI driver runs
; in NO_ACK mode so a solo board with no other CAN node can still transmit
; frames for inspection on a sniffer. Engage will refuse (no heartbeat) -
; this env is for waveform/protocol verification only, not for steering.
[env:esp32-s3_keya_noack]
extends = env:esp32-s3
build_flags =
	-DARDUINO_USB_MODE=1
	-DGPS_HEADING=0
	-DKEYA_MOTOR=1
	-DKEYA_NO_ACK=1

; Serial-flash environment - use when the S3's USB-CDC has taken over the
; native USB and esp-builtin JTAG can't open the device. Put the board into
; download mode (hold BOOT, tap RESET) before running.
[env:esp32-s3_serial]
extends = env:esp32-s3
upload_protocol = esptool

; OTA upload environment - flashes over the network via ArduinoOTA.
; Use the device's IP (or hostname.local if mDNS resolves on your network).
; Override password/port with build_flags if changed in src/config/defines.h.
[env:esp32-s3_ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = 192.168.178.126
upload_flags =
	--port=3232
	--auth=esp32-aio-ag

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=c++11
	-DUNIT_TEST
	-I src
test_build_src = no
