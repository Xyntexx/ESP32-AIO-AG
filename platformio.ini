[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
upload_protocol = esp-builtin
platform_packages =
	platformio/tool-openocd-esp32@~2.1200.0
lib_deps =
	adafruit/Adafruit BNO08x@^1.2.3
	sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2.20
	https://github.com/Xyntexx/WebServer_ESP32_SC_W6100
build_flags =
	-DARDUINO_USB_MODE=1
debug_tool = esp-builtin
monitor_filters = esp32_exception_decoder

; Serial-flash environment - use when the S3's USB-CDC has taken over the
; native USB and esp-builtin JTAG can't open the device. Put the board into
; download mode (hold BOOT, tap RESET) before running.
[env:esp32-s3_serial]
extends = env:esp32-s3
upload_protocol = esptool

; OTA upload environment - flashes over the network via ArduinoOTA.
; Use the device's IP (or hostname.local if mDNS resolves on your network).
; Override password/port with build_flags if changed in src/config/defines.h.
[env:esp32-s3_ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = 192.168.178.126
upload_flags =
	--port=3232
	--auth=esp32-aio-ag

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=c++11
	-DUNIT_TEST
	-I src
test_build_src = no
